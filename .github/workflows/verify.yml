name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix avatar-studio ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/entry.spec.ts
        env:
          ZMAP_BROWSER_CHANNEL: chromium
      - run: npm run test:e2e
        env:
          ZMAP_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-browser-evidence
          path: |
            test-results/
            docs/evidence/
