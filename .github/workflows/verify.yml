name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          ZMAP_BROWSER_CHANNEL: chromium

  avatar-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avatar-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avatar-studio/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          ZMAP_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-studio-visual-evidence
          path: |
            avatar-studio/docs/evidence/
            avatar-studio/test-results/
